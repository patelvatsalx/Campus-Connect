<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="error-page-container animate-slide-up">
    <a href="index.html" class="logo mb-4">
      <i class="fa-solid fa-graduation-cap" style="font-size: 2rem;"></i>
      <span style="font-size: 1.5rem;">Campus Connect</span>
    </a>
    
    <div class="error-code">404</div>
    
    <h2 class="mb-2">Lost in the Campus corridors?</h2>
    <p class="text-muted mb-4" style="max-width: 480px;">
      The classroom, event, or confessions page you are looking for has been moved, renamed, or doesn't exist. Let's get you back to the main building!
    </p>

    <!-- Visual SVG illustration -->
    <div style="font-size: 6rem; color: var(--text-light); opacity: 0.2; margin-bottom: 2rem;">
      <i class="fa-solid fa-compass-slash"></i>
    </div>
    
    <a href="index.html" class="btn btn-primary">
      <i class="fa-solid fa-house"></i>
      <span>Back to Home</span>
    </a>
  </div>

</body>
</html>
